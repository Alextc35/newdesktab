<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>NewDeskTab browser harness</title>
    <link rel="stylesheet" href="../src/styles/main.css">
  </head>
  <body>
    <script type="module">
      import { DEFAULT_BOOKMARK } from '../src/domain/bookmarks/bookmarkDefaults.js';
      import { createDefaultPersistedData } from '../src/platform/storage/persistedDataDefaults.js';
      import { DEVICE_ONBOARDING_KEY } from '../src/platform/storage/deviceOnboarding.js';
      import { DEVICE_DAILY_TIPS_KEY, getLocalDay } from '../src/platform/storage/deviceDailyTips.js';
      import { DEVICE_RELEASE_NOTES_KEY } from '../src/platform/storage/deviceReleaseNotes.js';

      const manifest = await fetch('../manifest.json').then(response => response.json());
      const params = new URLSearchParams(location.search);
      if (params.has('version')) manifest.version = params.get('version');

      const listeners = [];
      const isFreshProfile = !sessionStorage.getItem('newdesktab-test-local')
        && !sessionStorage.getItem('newdesktab-test-sync');

      function createArea(areaName) {
        const storageKey = `newdesktab-test-${areaName}`;
        const data = JSON.parse(sessionStorage.getItem(storageKey) || '{}');
        const persist = () => sessionStorage.setItem(storageKey, JSON.stringify(data));

        function select(keys) {
          if (keys === null || keys === undefined) return structuredClone(data);
          const requested = Array.isArray(keys) ? keys : [keys];
          return Object.fromEntries(
            requested
              .filter(key => Object.hasOwn(data, key))
              .map(key => [key, structuredClone(data[key])])
          );
        }

        function getStorageBytes(items) {
          const encoder = new TextEncoder();
          return Object.entries(items).reduce((total, [key, value]) => (
            total + encoder.encode(key).length + encoder.encode(JSON.stringify(value)).length
          ), 0);
        }

        return {
          QUOTA_BYTES: areaName === 'sync' ? 102400 : 10485760,
          get(keys, callback) { callback(select(keys)); },
          getBytesInUse(keys, callback) {
            callback(getStorageBytes(select(keys)));
          },
          set(items, callback) {
            const changes = {};
            for (const [key, value] of Object.entries(items)) {
              changes[key] = { oldValue: data[key], newValue: value };
              data[key] = structuredClone(value);
            }
            persist();
            callback?.();
            for (const listener of listeners) listener(changes, areaName);
          },
          remove(keys, callback) {
            const changes = {};
            for (const key of (Array.isArray(keys) ? keys : [keys])) {
              if (!Object.hasOwn(data, key)) continue;
              changes[key] = { oldValue: data[key] };
              delete data[key];
            }
            persist();
            callback?.();
            for (const listener of listeners) listener(changes, areaName);
          }
        };
      }

      globalThis.chrome = {
        runtime: {
          lastError: null,
          getManifest: () => manifest,
          getURL: path => new URL(`../${path}`, location.href).href
        },
        storage: {
          local: createArea('local'),
          sync: createArea('sync'),
          onChanged: {
            addListener(listener) { listeners.push(listener); }
          }
        }
      };

      // Production intentionally starts with an empty grid. Browser journeys
      // use two stable fixtures so tests can exercise existing-item behavior
      // without coupling the product defaults to test data.
      if (isFreshProfile && !new URLSearchParams(location.search).has('fresh')) {
        chrome.storage.local.set({
          ...createDefaultPersistedData(),
          [DEVICE_ONBOARDING_KEY]: { version: 1, status: 'completed' },
          bookmarks: [
            {
              ...DEFAULT_BOOKMARK,
              id: 'test-developed-by',
              name: 'DEVELOPED BY',
              url: 'https://www.alextc.es',
              urlLocked: true,
              noBackground: false,
              backgroundColor: '#161b22',
              gx: 0,
              gy: 1
            },
            {
              ...DEFAULT_BOOKMARK,
              id: 'test-banana',
              name: 'banana',
              backgroundImageUrl: 'https://cdn.osxdaily.com/wp-content/uploads/2013/07/dancing-banana.gif',
              backgroundImageUrlLocked: true,
              backgroundFavicon: false,
              noBackground: false,
              backgroundColor: '#eeff00',
              showText: false,
              showFavicon: false,
              gx: 1,
              gy: 1
            }
          ]
        });
      }

      // Ordinary journeys keep the optional daily card out of their way.
      // Release journeys opt in; the rest keep their original starting dialog.
      if (!params.has('release')) {
        chrome.storage.local.set({ [DEVICE_RELEASE_NOTES_KEY]: { version: manifest.version } });
      }
      // Help journeys opt in to exercise its production lifecycle.
      if (!new URLSearchParams(location.search).has('tips')) {
        chrome.storage.local.set({ [DEVICE_DAILY_TIPS_KEY]: { day: getLocalDay() } });
      }

      const browserProfile = new URLSearchParams(location.search).get('browser');
      const brands = browserProfile === 'brave'
        ? [{ brand: 'Chromium', version: '140' }]
        : [
            { brand: 'Chromium', version: '140' },
            { brand: 'Google Chrome', version: '140' }
          ];

      Object.defineProperty(navigator, 'userAgentData', {
        configurable: true,
        value: { brands }
      });

      if (browserProfile === 'brave') {
        Object.defineProperty(navigator, 'brave', {
          configurable: true,
          value: { isBrave: () => Promise.resolve(true) }
        });
      }

      const source = await fetch('../src/newtab.html').then(response => response.text());
      const parsed = new DOMParser().parseFromString(source, 'text/html');
      document.body.replaceChildren(...parsed.body.children);
      await import('../src/main.js');
    </script>
  </body>
</html>
